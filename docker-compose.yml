services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry_lab
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

